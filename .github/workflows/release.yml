name: Build and Release

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: true
        default: 'Manual build'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv
        
    - name: Install dependencies and Build executable
      run: |
        uv sync
        uv run main.py -b data/packages.json

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.bump_version.outputs.NEW_VERSION }}
        name: Release v${{ steps.bump_version.outputs.NEW_VERSION }}
        body: |
          Automated release for ${{ github.repository }} v${{ steps.bump_version.outputs.NEW_VERSION }}

          Triggered by: @${{ github.actor }}
          Reason: ${{ github.event.inputs.reason }}
        files: |
          dist/autopkg-windows-v${{ steps.bump_version.outputs.NEW_VERSION }}.exe
        draft: false
        prerelease: false
