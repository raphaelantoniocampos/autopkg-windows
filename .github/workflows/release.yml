name: Build and Release

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: true
        default: 'Manual build'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install uv
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv toml

    - name: Read version from pyproject.toml
      id: get_version
      run: |
        echo "version=$(uv run python -c 'import toml; print(toml.load(\"pyproject.toml\")[\"project\"][\"version\"])')" >> $GITHUB_ENV

    - name: Install dependencies and Build executable
      run: |
        uv sync
        uv run main.py -b data/packages.json

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.version }}
        name: Release v${{ env.version }}
        body: |
          Automated release for ${{ github.repository }} v${{ env.version }}

          Triggered by: @${{ github.actor }}
          Reason: ${{ github.event.inputs.reason }}
        files: |
          dist/autopkg-windows-v${{ env.version }}.exe
        draft: false
        prerelease: false

